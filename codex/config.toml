# Shared defaults. Run bash codex/install.sh after editing this file.
# The installer resolves @DOTFILES_DIR@ and keeps machine approvals in .local/.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"

[tui]
screen_reader_detection_done = true
status_line = ["model-with-reasoning", "current-dir", "thread-name"]
status_line_use_colors = true

[tui.model_availability_nux]
gpt-6-astra = 3
"gpt-6.1-sol" = 4

[marketplaces.jacky-mods]
source_type = "local"
source = "@DOTFILES_DIR@/claude/mods"

[marketplaces.claude-community]
source_type = "git"
source = "https://github.com/anthropics/claude-plugins-community.git"

[marketplaces.claude-plugins-official]
source_type = "git"
source = "https://github.com/anthropics/claude-plugins-official.git"

[plugins."answer-me-with-html@jacky-mods"]
enabled = true

[plugins."prompt-select@jacky-mods"]
enabled = true

[plugins."reply-style@jacky-mods"]
enabled = true

[plugins."slash-fuzzy@jacky-mods"]
enabled = true

[plugins."turn-footer@jacky-mods"]
enabled = true

[plugins."next-steps@claude-community"]
enabled = true

[plugins."clangd-lsp@claude-plugins-official"]
enabled = true

[plugins."code-simplifier@claude-plugins-official"]
enabled = true

[plugins."lua-lsp@claude-plugins-official"]
enabled = true

[plugins."mattpocock-skills@claude-plugins-official"]
enabled = true

[plugins."pyright-lsp@claude-plugins-official"]
enabled = true

[plugins."rust-analyzer-lsp@claude-plugins-official"]
enabled = true

[plugins."swift-lsp@claude-plugins-official"]
enabled = true
