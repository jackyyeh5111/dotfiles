# Resize
# On Mac, need addional setting for iTerm2:
# Open Preferences → Profiles → Keys.
#For Left Option key, set “Left Option Key” to “+Esc” (acts as Meta).
# bind -r H resize-pane -L 5
# bind -r L resize-pane -R 5
# bind -r K resize-pane -U 5
# bind -r J resize-pane -D 5

# Bind `Ctrl-b [` to enter copy mode (default)
bind v copy-mode

# Simulate 'viw' in copy-mode-vi: select word under cursor
bind -T copy-mode-vi i send -X select-word

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel "reattach-to-user-namespace pbcopy"

# reload and display msg
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'christoomey/vim-tmux-navigator'
#set -g @plugin 'catppuccin/tmux#v2.1.3' # See https://github.com/catppuccin/tmux/tags for additional tags

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

